<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0e" />

    <!--
      Bloco de metadata gerado a partir de src/config/seo.ts:
      - em dev e no build, preenchido pelo plugin em vite.config.ts
      - no prerender, reescrito por rota em scripts/prerender.mjs
      Não edite as tags aqui; edite src/config/seo.ts.
    -->
    <!--seo-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Pesos carregados = pesos efetivamente usados nas classes do projeto.
      Inter 400/500/600/700 · Space Grotesk 600/700 · JetBrains Mono 400/600.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Sem JavaScript, as animações nunca rodam e o estado inicial do Motion
      (opacity: 0) ficaria permanente no HTML pré-renderizado. Este override
      garante que o conteúdo apareça de qualquer forma.
    -->
    <noscript>
      <style>
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
